<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATRICE — Récapitulatif avant envoi</title>
<style>
:root{
  --nuit:#0F2238; --nuit2:#16304d; --ocre:#E3CC7A;
  --canard:#33838B; --orange:#FF982D; --carmin:#A01040;
  --gris:#8798ab; --txt:#e8edf3; --ligne:rgba(227,204,122,.18);
}
*{box-sizing:border-box}
body{margin:0;background:#0a1726;color:var(--txt);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
.app{max-width:920px;margin:0 auto;padding:26px 20px 90px}
.bar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ocre);padding-bottom:14px;margin-bottom:20px}
.bar h1{margin:0;font-size:21px;font-weight:600}
.bar .step{color:var(--ocre);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.bar .meta{margin-left:auto;color:var(--gris);font-size:12.5px;text-align:right}
.bar .meta b{color:var(--txt)}

.banner{border-radius:6px;padding:15px 17px;margin-bottom:18px}
.banner.go{background:linear-gradient(180deg,rgba(51,131,139,.18),rgba(51,131,139,.06));
  border:1px solid rgba(51,131,139,.5);border-left:5px solid var(--canard)}
.banner.stop{background:linear-gradient(180deg,rgba(160,16,64,.20),rgba(160,16,64,.07));
  border:1px solid rgba(160,16,64,.55);border-left:5px solid var(--carmin)}
.banner h2{margin:0 0 5px;font-size:15px}
.banner.go h2{color:#7ad3db} .banner.stop h2{color:#ff8fae}
.banner p{margin:0;font-size:13.5px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--nuit2);border:1px solid var(--ligne);border-radius:6px;padding:12px 14px}
.kpi .n{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.kpi.wait .n{color:var(--orange)} .kpi.ok .n{color:#7ad3db}

h3.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ocre);
  margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ligne)}

.svc{background:var(--nuit2);border:1px solid var(--ligne);border-radius:6px;margin-bottom:12px;overflow:hidden}
.svc.wait{border-color:rgba(255,152,45,.5)}
.svc header{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.svc header .id{flex:1;min-width:0}
.svc header h4{margin:0 0 3px;font-size:15px;font-weight:600}
.svc header .mail{font-size:13px;color:#9fd8de;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace}
.svc header .mail.none{color:#ffbe77;font-style:italic;font-family:inherit}
.pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.p-ok{background:rgba(51,131,139,.22);color:#7ad3db;border:1px solid rgba(51,131,139,.55)}
.p-wait{background:rgba(255,152,45,.18);color:#ffbe77;border:1px solid rgba(255,152,45,.6)}
.svc .body{padding:12px 16px}
.svc .count{font-size:12.5px;color:var(--gris);margin-bottom:9px}
.coms{display:flex;flex-wrap:wrap;gap:6px}
.com{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:4px;
  padding:4px 9px;font-size:12.5px;display:flex;gap:7px;align-items:baseline}
.com b{font-weight:600} .com i{font-style:normal;color:var(--gris);font-size:11px;font-variant-numeric:tabular-nums}
.why{margin-top:11px;padding:11px 13px;background:rgba(255,152,45,.09);border-left:3px solid var(--orange);
  border-radius:0 4px 4px 0;font-size:13px}
.why b{color:#ffbe77}
.relance{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px;font-size:12.5px;color:var(--gris)}
.tag{background:rgba(255,152,45,.14);border:1px solid rgba(255,152,45,.4);color:#ffbe77;
  border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.checks{background:var(--nuit2);border:1px solid var(--ligne);border-radius:6px;padding:6px 16px}
.chk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.chk:last-child{border-bottom:0}
.chk .ic{width:19px;height:19px;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;margin-top:1px}
.ic.ok{background:rgba(51,131,139,.25);color:#7ad3db;border:1px solid rgba(51,131,139,.6)}
.ic.echec{background:rgba(160,16,64,.25);color:#ff8fae;border:1px solid rgba(160,16,64,.7)}
.ic.avertissement{background:rgba(255,152,45,.2);color:#ffbe77;border:1px solid rgba(255,152,45,.6)}
.chk .t{font-size:13.5px}
.chk .t small{display:block;color:var(--gris);font-size:12px;margin-top:2px}

.foot{position:sticky;bottom:0;margin-top:24px;background:rgba(10,23,38,.96);
  border-top:1px solid var(--ligne);padding:15px 0 6px;backdrop-filter:blur(6px)}
.confirm{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-bottom:12px;cursor:pointer}
.passe{display:block;margin:0 0 14px}
.passe>span{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.passe input{width:100%;max-width:420px;padding:9px 11px;border-radius:8px;
  border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.28);color:inherit;font-size:14px}
.passe small{display:block;font-size:11.5px;color:var(--gris);margin-top:6px;max-width:640px}
.champs{display:grid;grid-template-columns:1fr 2fr 1fr;gap:12px;margin-bottom:16px}
.champ label{display:block;font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.champ input{width:100%;padding:10px 12px;border-radius:5px;border:1px solid rgba(255,255,255,.18);
  background:var(--nuit2);color:var(--txt);font:inherit;font-size:14px}
textarea.coller{width:100%;min-height:190px;padding:12px 14px;border-radius:6px;
  border:1px solid rgba(255,255,255,.18);background:var(--nuit2);color:var(--txt);
  font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.aide{font-size:12.5px;color:var(--gris);margin:8px 0 14px}
.aide b{color:var(--txt)}
.pb{background:rgba(160,16,64,.12);border:1px solid rgba(160,16,64,.45);border-left:4px solid var(--carmin);
  border-radius:0 5px 5px 0;padding:12px 14px;margin-bottom:12px;font-size:13px}
.pb h4{margin:0 0 7px;font-size:13px;color:#ff8fae}
.pb ul{margin:0;padding-left:18px} .pb li{margin:3px 0}
.prec{display:grid;grid-template-columns:minmax(140px,1fr) 2fr;gap:10px;align-items:start;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.prec:last-of-type{border-bottom:0}
.prec .quoi b{display:block;font-size:14px}
.prec .quoi small{display:block;color:var(--gris);font-size:11.5px;margin-top:2px}
.prec select,.prec input{width:100%;padding:8px 10px;border-radius:5px;
  border:1px solid rgba(255,255,255,.18);background:var(--nuit2);color:var(--txt);font:inherit;font-size:13.5px}
.prec input{margin-top:7px}
@media(max-width:700px){.champs{grid-template-columns:1fr}}
.confirm input{margin-top:3px;width:16px;height:16px;accent-color:var(--ocre);cursor:pointer}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:600;border-radius:5px;padding:11px 20px;cursor:pointer;border:1px solid transparent}
button:disabled{cursor:not-allowed}
.primaire{background:var(--ocre);color:var(--nuit);border-color:var(--ocre)}
.primaire:disabled{background:rgba(255,255,255,.07);color:var(--gris);border-color:rgba(255,255,255,.12)}
.ghost{background:transparent;color:var(--txt);border-color:rgba(255,255,255,.22);font-size:13px;padding:8px 14px}
.ghost:hover{border-color:var(--ocre)}
.hint{font-size:12.5px;color:var(--gris)} .hint.blk{color:#ff8fae}
.centre{text-align:center;padding:70px 20px;color:var(--gris)}
.centre h2{color:var(--txt);font-weight:600;font-size:19px;margin:0 0 10px}
.centre code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:3px;font-size:12.5px}
footer.src{margin-top:26px;padding-top:14px;border-top:1px solid var(--ligne);color:var(--gris);font-size:11.5px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.bar .meta{margin-left:0;text-align:left;width:100%}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="centre"><h2>Chargement…</h2></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script>
// ---------------------------------------------------------------- configuration
// À renseigner une fois l'inscription d'application créée dans Microsoft Entra.
// Côté Entra : « Exposer une API » -> URI api://<CLIENT_ID> -> étendue access_as_user.
// C'est cette étendue qui donne au jeton l'audience que le verrou serveur attend.
const CONFIG = {
  TENANT_ID: 'c4418640-34ad-4f51-ae6a-8550db7812cb', // ETUDE FIDAL NOTAIRES — fidal.notaires.fr
  CLIENT_ID: '195c7db4-b027-4942-82ff-3a2ba796400d', // inscription « MATRICE », 17 août 2026
};

const app = document.getElementById('app');
const e = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let pca = null, compte = null, jeton = null, vue = null;
// Les arbitrages du notaire sur les communes que l'annuaire n'a pas su trancher.
// Ils survivent aux analyses successives : on ne fait pas retaper deux fois.
let precisions = {};
// 'entra' quand l'inscription existe, 'recette' tant qu'elle n'existe pas.
// Le serveur tranche vraiment ; ici on choisit seulement quoi demander à l'écran.
let mode = 'entra', recette = { passe: null, initiales: null };
const dossier = new URLSearchParams(location.search).get('dossier');

// ------------------------------------------------------------------ démarrage
// Sans dossier dans l'adresse, MATRICE n'est pas en panne : il attend qu'on lui
// en donne un. C'est l'écran d'import — les étapes 1 à 3 que le récapitulatif
// annonçait sans qu'elles existent.
const demarrer = () => (dossier ? charger() : ecranImport());

(async function () {
  // Pas d'inscription Entra : on passe en recette, mot de passe partagé.
  if (CONFIG.TENANT_ID === 'A_RENSEIGNER' || CONFIG.CLIENT_ID === 'A_RENSEIGNER') {
    mode = 'recette';
    const gardes = sessionStorage.getItem('matrice-recette');
    if (gardes) { recette = JSON.parse(gardes); return demarrer(); }
    return ecranRecette();
  }

  // Le CDN expose la bibliothèque sous window.msal ; notre instance s'appelle pca,
  // sinon la variable locale masquerait la bibliothèque et rien ne s'initialiserait.
  pca = new window.msal.PublicClientApplication({
    auth: {
      clientId: CONFIG.CLIENT_ID,
      authority: `https://login.microsoftonline.com/${CONFIG.TENANT_ID}`,
      redirectUri: location.origin,
    },
    cache: { cacheLocation: 'sessionStorage' },
  });
  await pca.initialize();

  const comptes = pca.getAllAccounts();
  if (comptes.length) { compte = comptes[0]; await demarrer(); }
  else ecranConnexion();
})().catch((err) => ecranSimple('Erreur au démarrage', e(err.message)));

function ecranSimple(titre, html) {
  app.innerHTML = `<div class="centre"><h2>${e(titre)}</h2><p>${html}</p></div>`;
}

function ecranRecette() {
  app.innerHTML = `<div class="centre"><h2>MATRICE</h2>
    <p>Dossier ${e(dossier)} — <b style="color:var(--orange)">mode recette</b></p>
    <p style="max-width:440px;margin:14px auto 0">L’inscription Entra n’est pas encore créée.
      L’accès se fait par mot de passe partagé, et vos initiales accompagnent chaque action au journal.</p>
    <div style="max-width:300px;margin:24px auto 0;display:flex;flex-direction:column;gap:10px">
      <input id="passe" type="password" placeholder="Mot de passe" autocomplete="off"
        style="padding:10px 12px;border-radius:5px;border:1px solid rgba(255,255,255,.22);
               background:var(--nuit2);color:var(--txt);font:inherit;font-size:14px">
      <input id="init" type="text" placeholder="Vos initiales (2 à 4 lettres)" maxlength="4" autocomplete="off"
        style="padding:10px 12px;border-radius:5px;border:1px solid rgba(255,255,255,.22);
               background:var(--nuit2);color:var(--txt);font:inherit;font-size:14px;text-transform:uppercase">
      <button class="primaire" id="cx">Ouvrir le dossier</button>
      <span class="hint blk" id="err"></span>
    </div></div>`;

  const passe = document.getElementById('passe'), init = document.getElementById('init');
  const err = document.getElementById('err');
  const aller = async () => {
    const i = init.value.trim().toUpperCase();
    if (!/^[A-Z]{2,4}$/.test(i)) { err.textContent = 'Initiales : 2 à 4 lettres.'; return; }
    if (!passe.value) { err.textContent = 'Mot de passe requis.'; return; }
    recette = { passe: passe.value, initiales: i };
    try {
      await demarrer();
      // On ne retient les identifiants qu'une fois qu'ils ont ouvert quelque chose,
      // et seulement pour la session : rien ne survit à la fermeture de l'onglet.
      sessionStorage.setItem('matrice-recette', JSON.stringify(recette));
    } catch { /* charger() a déjà affiché */ }
  };
  document.getElementById('cx').onclick = aller;
  for (const champ of [passe, init]) champ.onkeydown = (ev) => { if (ev.key === 'Enter') aller(); };
  passe.focus();
}

function ecranConnexion() {
  app.innerHTML = `<div class="centre"><h2>MATRICE</h2>
    <p>Demandes d’extrait de matrice cadastrale — dossier ${e(dossier)}</p>
    <p style="margin-top:22px"><button class="primaire" id="cx">Se connecter</button></p></div>`;
  document.getElementById('cx').onclick = async () => {
    try {
      const r = await pca.loginPopup(demandeConnexion());
      compte = r.account; await demarrer();
    } catch (err) { ecranSimple('Connexion refusée', e(err.message)); }
  };
}

/**
 * Ce que la connexion demande — et surtout ce qu'elle NE demande PAS.
 *
 * `scopes` obtient le jeton de NOTRE API : c'est lui que vérifie le verrou, et
 * c'est tout ce qu'il faut pour entrer.
 *
 * L'autorisation d'écrire dans la messagerie (Mail.ReadWrite, nécessaire à
 * l'échange on-behalf-of) n'est délibérément PAS réclamée ici. Sur un tenant où
 * le consentement utilisateur est désactivé — c'est le cas chez FIDAL —, la
 * réclamer à la connexion rend l'approbation administrateur obligatoire pour
 * seulement OUVRIR un dossier : refuser l'autorisation ferme l'application
 * entière. Un confort ne doit jamais conditionner l'accès.
 *
 * Sans ce consentement, l'échange échoue en AADSTS65001 et le courriel part en
 * .eml — ce qui est un mode de fonctionnement complet, pas une panne.
 *
 * Pour l'activer le jour où l'administrateur l'accorde, il suffit d'ajouter
 * extraScopesToConsent: ['https://graph.microsoft.com/Mail.ReadWrite'] ci-dessous.
 */
function demandeConnexion(extra = {}) {
  return { scopes: [`api://${CONFIG.CLIENT_ID}/access_as_user`], ...extra };
}

async function obtenirJeton() {
  const p = { scopes: [`api://${CONFIG.CLIENT_ID}/access_as_user`], account: compte };
  try { return (await pca.acquireTokenSilent(p)).accessToken; }
  catch { return (await pca.acquireTokenPopup(p)).accessToken; }
}

async function entetes() {
  if (mode === 'recette') {
    return { 'x-matrice-passe': recette.passe, 'x-matrice-auteur': recette.initiales };
  }
  jeton = await obtenirJeton();
  return { Authorization: `Bearer ${jeton}` };
}

async function api(chemin, options = {}) {
  const r = await fetch(chemin, {
    ...options,
    headers: { ...(await entetes()), 'Content-Type': 'application/json', ...(options.headers || {}) },
  });
  const corps = await r.json().catch(() => ({}));
  if (!r.ok) {
    // Un mot de passe refusé doit ramener à l'écran de saisie, pas laisser
    // l'utilisateur devant un message qu'il ne peut pas corriger.
    if (mode === 'recette' && r.status === 401) {
      sessionStorage.removeItem('matrice-recette');
      ecranRecette();
      document.getElementById('err').textContent = corps.erreur || 'Accès refusé.';
    }
    throw new Error(corps.erreur || `HTTP ${r.status}`);
  }
  return corps;
}

async function charger() {
  app.innerHTML = '<div class="centre"><h2>Chargement du dossier…</h2></div>';
  try { vue = await api(`/api/dossier?dossier=${encodeURIComponent(dossier)}`); dessiner(); }
  catch (err) { ecranSimple('Dossier illisible', e(err.message)); }
}

// -------------------------------------------------------------------- rendu
function dessiner() {
  const v = vue, r = v.resume;
  const bloque = !v.envoiPossible;

  const banniere = bloque
    ? `<div class="banner stop"><h2>L’envoi est bloqué</h2><p>${e(v.bloquants.join(' · '))}. Rien ne partira tant que ce point n’est pas levé.</p></div>`
    : `<div class="banner go"><h2>${r.formulaires} commune${r.formulaires > 1 ? 's' : ''} sur ${r.communes} ${r.formulaires > 1 ? 'partent' : 'part'} maintenant</h2>
       <p>${r.enAttente ? `${r.enAttente} commune${r.enAttente > 1 ? 's' : ''} sans destinataire fiable : mise${r.enAttente > 1 ? 's' : ''} en file et relancée${r.enAttente > 1 ? 's' : ''} tous les 7 jours ouvrés, sans bloquer le reste.` : 'Aucune commune en attente.'}</p></div>`;

  app.innerHTML = `
  <div class="bar">
    <span class="step">Étape 4 sur 4</span>
    <h1>Récapitulatif avant envoi</h1>
    <div class="meta">Dossier <b>${e(v.dossier)}</b> — ${e(v.societe)}<br>
      ${v.siren ? 'SIREN ' + e(v.siren) + ' · ' : ''}${mode === 'recette'
        ? `<span style="color:var(--orange)">recette</span> · ${e(recette.initiales)}`
        : 'connecté : ' + e(compte?.username || '')}</div>
  </div>
  ${banniere}
  <div class="kpis">
    <div class="kpi"><div class="n">${r.lots}</div><div class="l">lots du portefeuille</div></div>
    <div class="kpi"><div class="n">${r.communes}</div><div class="l">communes</div></div>
    <div class="kpi ok"><div class="n">${r.courriels}</div><div class="l">courriel${r.courriels > 1 ? 's' : ''} · ${r.formulaires} formulaires</div></div>
    <div class="kpi wait"><div class="n">${r.enAttente}</div><div class="l">en attente</div></div>
  </div>

  ${v.envois.length ? `<h3 class="sec">Ce qui part maintenant</h3>${v.envois.map(blocEnvoi).join('')}` : ''}
  ${v.enAttente.length ? `<h3 class="sec">Ce qui reste en attente</h3>${v.enAttente.map(blocAttente).join('')}` : ''}
  ${v.dejaParties.length ? `<h3 class="sec">Déjà parties</h3><div class="svc"><div class="body">
      <div class="coms">${v.dejaParties.map(chip).join('')}</div></div></div>` : ''}

  <h3 class="sec">Contrôles</h3>
  <div class="checks">${v.controles.map((c) => `
    <div class="chk"><span class="ic ${c.etat}">${c.etat === 'ok' ? '✓' : c.etat === 'echec' ? '✕' : '!'}</span>
      <div class="t">${e(c.libelle)}${c.detail ? `<small>${e(c.detail)}</small>` : ''}</div></div>`).join('')}
  </div>

  <div class="foot">
    <label class="confirm"><input type="checkbox" id="ok">
      <span>J’ai lu la liste des destinataires et le détail des communes. Je confirme l’envoi sous ma responsabilité${r.enAttente ? ', et j’accepte que les communes en attente ne partent pas' : ''}.</span></label>
    ${(v.sceau?.signature || v.sceau?.cachet) ? `
    <label class="passe">
      <span>Phrase de signature</span>
      <input type="password" id="passeSig" autocomplete="off" placeholder="laisser vide pour des formulaires non signés">
      <small>Elle déchiffre le fac-similé de votre signature, le temps de générer les formulaires.
        Elle n'est ni conservée ni journalisée. Vide, les demandes partent non signées.</small>
    </label>` : ''}
    <div class="actions">
      <input type="file" id="mandat" accept="application/pdf" style="display:none">
      <button class="primaire" id="go" disabled>Envoyer ${r.courriels} courriel${r.courriels > 1 ? 's' : ''} · ${r.formulaires} formulaires</button>
      <button class="ghost" id="simuler">Simuler</button>
      <button class="ghost" id="rafraichir">Rafraîchir</button>
      <span class="hint ${bloque ? 'blk' : ''}" id="hint"></span>
    </div>
  </div>

  <footer class="src">Les décomptes, le routage et les contrôles viennent du serveur ; cet écran ne fait que les afficher.
  Aucune règle n’est évaluée dans le navigateur.</footer>`;

  document.getElementById('rafraichir').onclick = charger;
  const ok = document.getElementById('ok'), go = document.getElementById('go'), hint = document.getElementById('hint');
  const maj = () => {
    go.disabled = bloque || !ok.checked;
    hint.textContent = bloque ? `Bloqué : ${v.bloquants.join(', ')}`
      : !ok.checked ? 'Cochez la confirmation pour activer l’envoi'
      : `Prêt. ${r.courriels} courriel, ${r.formulaires} formulaires.`;
    hint.className = 'hint' + (bloque ? ' blk' : '');
  };
  ok.onchange = maj; maj();

  go.onclick = () => lancer(false);
  document.getElementById('simuler').onclick = () => lancer(true);

  app.querySelectorAll('[data-debloquer]').forEach((b) => { b.onclick = () => debloquer(b.dataset.debloquer, b.dataset.commune); });
  app.querySelectorAll('[data-abandonner]').forEach((b) => { b.onclick = () => abandonner(b.dataset.abandonner, b.dataset.commune); });
}

// ------------------------------------------------------------------ envoi
/**
 * Le mandat est demandé à chaque fois, y compris en simulation : c'est lui qui
 * pèse le plus lourd dans les pièces jointes, et mesurer sans lui ne mesurerait
 * rien d'utile. Le serveur refuse de toute façon sans lui.
 */
function demanderMandat() {
  return new Promise((resoudre) => {
    const champ = document.getElementById('mandat');
    champ.value = '';
    champ.onchange = () => {
      const f = champ.files?.[0];
      if (!f) return resoudre(null);
      const lecteur = new FileReader();
      lecteur.onload = () => resoudre({ nom: f.name, contenuBase64: String(lecteur.result).split(',')[1] });
      lecteur.onerror = () => resoudre(null);
      lecteur.readAsDataURL(f);
    };
    champ.click();
  });
}

/** Un .eml rendu par le repli : on le donne à télécharger, l'utilisateur l'ouvre dans Outlook. */
function telechargerEml(nom, contenu) {
  const url = URL.createObjectURL(new Blob([contenu], { type: 'message/rfc822' }));
  const a = document.createElement('a');
  a.href = url; a.download = nom; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function lancer(simulation) {
  const hint = document.getElementById('hint');
  const mandat = await demanderMandat();
  if (!mandat) { hint.textContent = 'Envoi annulé : aucun mandat joint.'; return; }

  const go = document.getElementById('go'), sim = document.getElementById('simuler');
  go.disabled = true; sim.disabled = true;
  hint.className = 'hint';
  hint.textContent = simulation ? 'Simulation en cours…' : 'Génération des formulaires…';

  try {
    // La phrase ne sort pas d'ici autrement que dans cet appel, et le champ
    // est vidé aussitôt : elle ne doit pas survivre à l'envoi dans le DOM.
    const champPasse = document.getElementById('passeSig');
    const passeSignature = champPasse?.value || undefined;

    const r = await api('/api/envoyer', {
      method: 'POST',
      body: JSON.stringify({ dossier, mandat, simulation, passeSignature }),
    });
    if (champPasse) champPasse.value = '';

    const detail = r.envois.map((e) => `${e.formulaires} formulaires → ${e.destinataire}`).join('\n');

    if (simulation) {
      alert(`Simulation — rien n'a été écrit ni envoyé.\n\n`
        + `${r.brouillons} courriel(s), ${r.formulaires} formulaires.\n\n${detail}\n\n`
        + `Signature : ${r.signature}`);
      return;
    }

    // Le serveur rend un .eml quand Graph n'a pas pu être joint. Le MOTIF est la
    // seule chose qui permette de comprendre pourquoi — l'afficher a évité
    // plusieurs allers-retours de diagnostic à l'aveugle.
    const replis = r.envois.filter((e) => e.voie === 'eml' && e.eml);
    for (const e of replis) {
      telechargerEml(`MATRICE_${dossier}_${e.destinataire.split('@')[0]}.eml`, e.eml);
    }

    const motifs = [...new Set(r.envois.map((e) => e.motifRepli).filter(Boolean))];
    const consentementManquant = motifs.some((m) => m.includes('AADSTS65001'));

    // Le repli .eml n'est pas une panne : il faut le dire, sinon chaque envoi
    // ressemble à un échec. On ne montre le motif technique que lorsqu'il
    // n'est PAS la cause connue et assumée.
    const explication = replis.length === 0
      ? '\nLes brouillons sont dans votre boîte. Relisez avant d’envoyer.'
      : consentementManquant
        ? `\n${replis.length} fichier(s) .eml téléchargés : ouvrez-les dans Outlook, relisez, envoyez.`
          + `\n\nLe dépôt direct dans votre boîte suppose une approbation de l’administrateur du`
          + ` tenant, qui n’a pas été accordée. C’est le fonctionnement prévu en attendant, et`
          + ` le message est identique dans les deux cas.`
        : `\n${replis.length} fichier(s) .eml téléchargés : ouvrez-les dans Outlook, relisez, envoyez.`
          + `\n\nMotif du repli :\n${motifs.join('\n\n')}`;

    alert(`${r.brouillons} brouillon(s) déposé(s), ${r.formulaires} formulaires.\n\n${detail}\n\n`
      + `Signature : ${r.signature}\n${explication}`);

    await charger();
  } catch (err) {
    hint.className = 'hint blk';
    hint.textContent = 'Échec : ' + err.message;
    go.disabled = false; sim.disabled = false;
  }
}

// Rien n'est interprété ici : le texte collé part tel quel au serveur, qui le

  <div class="bar">

    <h1>Nouveau dossier</h1>
    <div class="meta">${mode === 'recette'

  </div>

  <div class="champs">
    <div class="champ"><label for="num">Numéro de dossier</label>
      <input id="num" value="${e(propose)}" autocomplete="off"></div>
    <div class="champ"><label for="soc">Société</label>

    <div class="champ"><label for="sir">SIREN</label>

  </div>

  <h3 class="sec">Le portefeuille</h3>

  <p class="aide">Trois formes acceptées, MATRICE reconnaît laquelle il reçoit.
    <b>Un tableau</b> copié depuis Excel ou REDPAR, avec le code INSEE — c'est la forme la plus sûre.
    <b>Les noms des dossiers Drive</b> du client, <code>0199_ATTICHES_6 PLACE DES LANDAUS</code> —
    un dossier compte pour un lot, et les communes sont résolues contre le Code officiel géographique.
    <b>Une simple liste</b> de communes ou de codes.</p>

  <div class="actions">
    <input type="file" id="fic" accept=".csv,.txt,.tsv,text/plain" style="display:none">
    <button class="primaire" id="analyser">Analyser</button>
    <button class="ghost" id="parcourir">Déposer un fichier</button>
    <span class="hint" id="hint"></span>
  </div>

  <div id="apercu"></div>

  <footer class="src">Rien n'est écrit tant que vous n'avez pas validé. L'analyse et le routage

  const hint = document.getElementById('hint');

function champsImport() {
  const dossier = document.getElementById('num').value.trim();
  const societe = document.getElementById('soc').value.trim();
  const siren = document.getElementById('sir').value.replace(/\s/g, '');
  const texte = document.getElementById('txt').value;
  return { dossier, societe, siren: siren || null, texte };
}

async function analyserPortefeuille(ecrire) {
  const hint = document.getElementById('hint');
  const apercu = document.getElementById('apercu');
  const { dossier: num, societe, siren, texte } = champsImport();

  if (!num || !societe) { hint.className = 'hint blk'; hint.textContent = 'Numéro de dossier et société sont obligatoires.'; return; }
  if (!texte.trim()) { hint.className = 'hint blk'; hint.textContent = 'Collez le portefeuille, ou déposez un fichier.'; return; }

  hint.className = 'hint';
  hint.textContent = ecrire ? 'Création du dossier…' : 'Analyse et routage…';

  let r;
  try {
    r = await api('/api/importer', {
      method: 'POST',
      body: JSON.stringify({ dossier: num, societe, siren, texte, precisions, simulation: !ecrire }),
    });
  } catch (err) {
    hint.className = 'hint blk';
    hint.textContent = 'Échec : ' + err.message;
    return;
  }

  if (ecrire) {
    location.href = `?dossier=${encodeURIComponent(num)}`;
    return;
  }

  const alerte = String(r.controleCommunes || '').startsWith('NON');
  hint.className = 'hint' + (alerte ? ' blk' : '');
  hint.textContent = `Lu comme : ${r.format}. Référentiel SDIF du ${r.referentielDu}. `
    + `Communes : ${r.controleCommunes || '—'}.`;
  apercu.innerHTML = vueImport(r);
  const b = document.getElementById('creer');
  if (b) b.onclick = () => analyserPortefeuille(true);
  cablerPrecisions();
}

/** Les listes de précision : recherche, lecture des choix, puis nouvelle analyse. */
function cablerPrecisions() {
  document.querySelectorAll('.prec select').forEach((s, i) => {
    const champ = document.getElementById('code' + i);
    const maj = () => {
      const autre = s.value === '__autre';
      if (champ) champ.style.display = autre ? 'block' : 'none';
      if (autre && champ) champ.focus();
    };
    s.onchange = maj; maj();

    // La recherche libre : indispensable quand la commune a disparu — aucune
    // proposition ne ressemblera jamais à LOMME — ou quand le nom du dossier
    // est trop court pour que l'annuaire vise juste.
    //
    // Elle se déclenche à la frappe. Deux précautions, sans quoi on interroge
    // l'annuaire de l'État à chaque lettre : un délai de repos de 300 ms, et
    // l'abandon de la requête précédente dès qu'une nouvelle part. Une réponse
    // en retard ne doit jamais écraser une plus récente — c'est ce qui fait
    // qu'on croit avoir cherché « lille » et qu'on lit les résultats de « lil ».
    const q = document.getElementById('q' + i);
    const etat = document.getElementById('etat' + i);
    if (!q) return;

    let minuteur = null;
    let jeton = 0;

    const chercher = async () => {
      const texte = q.value.trim();
      if (texte.length < 2) { if (etat) etat.textContent = ''; return; }
      const mien = ++jeton;
      if (etat) etat.textContent = 'recherche…';
      try {
        const r = await api('/api/communes?q=' + encodeURIComponent(texte));
        if (mien !== jeton) return; // une frappe plus récente a pris la main
        const trouvees = r.communes || [];
        if (etat) {
          etat.textContent = trouvees.length
            ? `${trouvees.length} commune${trouvees.length > 1 ? 's' : ''} — choisissez dans la liste`
            : 'aucune commune de ce nom';
        }
        if (!trouvees.length) return;
        // On REMPLACE les propositions plutôt que d'y ajouter : mélanger un
        // résultat de recherche à des approchants automatiques rendrait la
        // liste illisible au moment précis où il faut choisir juste.
        const choisi = s.value;
        s.innerHTML = '<option value="">— à préciser —</option>'
          + trouvees.map((c) => `<option value="${e(c.code)}">${e(c.nom)}${
              c.departement ? ' — ' + e(c.departement) : ''} · ${e(c.code)}</option>`).join('')
          + '<option value="__autre">Autre — saisir le code INSEE</option>';
        s.onchange = maj;
        // Un choix déjà fait survit à une nouvelle frappe s'il figure encore.
        if (choisi && [...s.options].some((o) => o.value === choisi)) s.value = choisi;
        else if (trouvees.length === 1) s.value = trouvees[0].code;
        maj();
      } catch (err) {
        if (mien === jeton && etat) etat.textContent = 'annuaire indisponible';
      }
    };

    q.oninput = () => { clearTimeout(minuteur); minuteur = setTimeout(chercher, 300); };
    q.onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); clearTimeout(minuteur); chercher(); } };
  });

  const b = document.getElementById('reprendre');
  if (!b) return;
  b.onclick = () => {
    document.querySelectorAll('.prec select').forEach((s, i) => {
      const nom = s.dataset.nom;
      const champ = document.getElementById('code' + i);
      const code = s.value === '__autre' ? (champ?.value || '').trim().toUpperCase() : s.value;
      // Un choix vide efface l'arbitrage précédent plutôt que de le figer.
      if (code) precisions[nom] = code; else delete precisions[nom];
    });
    analyserPortefeuille(false);
  };
}

// ------------------------------------------------------------------ actions
async function debloquer(id, commune) {
  const adresse = prompt(`Adresse du service pour ${commune} :\n\n`
    + `Elle sera enregistrée telle quelle et la commune repartira dans un envoi de rattrapage.`);
  if (!adresse) return;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(adresse.trim())) return alert('Cette adresse ne ressemble pas à un courriel.');
  try {
    await api('/api/mettre-en-attente', {
      method: 'POST',
      body: JSON.stringify({ action: 'debloquer', demandeId: Number(id), destinataire: adresse.trim() }),
    });
    await charger();
  } catch (err) { alert('Échec : ' + err.message); }
}

async function abandonner(id, commune) {
  const motif = prompt(`Retirer ${commune} du dossier. Motif :`);
  if (!motif) return;
  try {
    await api('/api/mettre-en-attente', {
      method: 'POST',
      body: JSON.stringify({ action: 'abandonner', demandeId: Number(id), motif: motif.trim() }),
    });
    await charger();
  } catch (err) { alert('Échec : ' + err.message); }
}
